<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafiq Builders · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: header strip, then a responsive grid of tool cards. New tool = one entry in the TOOLS list. */
  --ink:#16243a; --muted:#5b6678; --paper:#f4f6f8; --card:#ffffff; --line:#d7dde5; --accent:#0f5c7a; --accent-soft:#e3f0f5;
  --display:"Fraunces", Georgia, serif; --body:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e6ebf2; --muted:#9aa6b8; --paper:#0f141b; --card:#171e28; --line:#2a3442; --accent:#4fb3d6; --accent-soft:#16303b; color-scheme:dark; } }
:root[data-theme="dark"]{
  --ink:#e6ebf2; --muted:#9aa6b8; --paper:#0f141b; --card:#171e28; --line:#2a3442; --accent:#4fb3d6; --accent-soft:#16303b; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
header{padding:28px 24px 8px;max-width:1100px;margin:0 auto}
.brand{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:600 30px/1.15 var(--display);margin:4px 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:16px 24px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tool{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s}
a.tool:hover{border-color:var(--accent);transform:translateY(-2px)}
a.tool:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.icon{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tool h2{font:600 17px/1.2 var(--body);margin:0}
.tool p{margin:0;color:var(--muted);font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.open{font-weight:600;font-size:13.5px;color:var(--accent)}
.soon{border-style:dashed;background:transparent}
.soon .icon{background:transparent;border:1px dashed var(--line);color:var(--muted)}
footer{max-width:1100px;margin:0 auto;padding:0 24px 28px;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion: reduce){.tool{transition:none}a.tool:hover{transform:none}}
</style>
</head>
<body>
<header>
  <div class="brand">Rafiq Builders</div>
  <h1>Tools Dashboard</h1>
  <p>Choose a tool. Each tool keeps its own settings.</p>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>Settings and registers are saved in this browser.</footer>
<script>
// To add a tool: add an entry here and create its folder in the repo.
const TOOLS=[
  {name:"Cheque Printer", href:"cheque-printer/", desc:"Fill in and print cheques. Date boxes, payee, amount and amount in words are filled automatically.", tags:["25 banks","Print / PDF","Register"],
   icon:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h7M6 14h4M15.5 13.5h3"/></svg>'},
  {name:"All Vehicles", href:"vehicles/", desc:"All company vehicles in one place.", tags:["Coming soon"],
   icon:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-5h14l2 5v4h-2"/><path d="M5 17H3v-4h18"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/></svg>'},
];
const grid=document.getElementById("grid");
grid.innerHTML=TOOLS.map(t=>`<a class="tool" href="${t.href}"><div class="icon">${t.icon}</div><h2>${t.name}</h2><p>${t.desc}</p><div class="tags">${t.tags.map(g=>`<span class="tag">${g}</span>`).join("")}</div><span class="open">Open →</span></a>`).join("")+
 `<div class="tool soon" aria-label="More tools coming soon"><div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div><h2>More tools coming soon</h2><p>New tools will appear here.</p></div>`;
</script>
</body>
</html>
